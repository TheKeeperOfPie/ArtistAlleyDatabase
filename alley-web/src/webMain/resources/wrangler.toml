# Local build/dev commands
# ./gradlew -Pdebug :modules:alley-app:webRelease
# cd "./modules/alley-app/build/dist/web/developmentExecutable" && npm install && npx wrangler dev --ip 0.0.0.0 --host 0.0.0.0 --local
name = "artistalley-worker"
main = "functions/worker.mjs"
compatibility_date = "2026-10-12"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

[build]
command = "npm install @noble/curves aws4fetch @cloudflare/pages-plugin-cloudflare-access"
cwd = "./functions/"

[assets]
directory = "./public/"
not_found_handling = "single-page-application"
run_worker_first = ["/edit/api", "/form/api", "/edit/api/*", "/form/api/*"]

[[kv_namespaces]]
binding = "ARTIST_ALLEY_CACHE_KV"
id = "artistAlleyCacheKVId"

[placement]
mode = "smart"

[[d1_databases]]
database_id = "artistAlleyDatabaseId"
binding = "ARTIST_ALLEY_DB"
database_name = "ARTIST_ALLEY_DB"
preview_database_id = "ARTIST_ALLEY_DB"

[[d1_databases]]
database_id = "artistAlleyFormDatabaseId"
binding = "ARTIST_ALLEY_FORM_DB"
database_name = "ARTIST_ALLEY_FORM_DB"
preview_database_id = "ARTIST_ALLEY_FORM_DB"

[[r2_buckets]]
binding = "ARTIST_ALLEY_IMAGES_BUCKET"
bucket_name = "artist-alley-images"

[vars]
IMAGES_ACCESS_KEY_ID = "imagesAccessKeyId"
IMAGES_SECRET_ACCESS_KEY_ID = "imagesSecretAccessKeyId"
IMAGES_CLOUDFLARE_URL = "imagesCloudflareUrl"

[[durable_objects.bindings]]
name = "LAST_VIEWED_SERVER"
class_name = "LastViewedServer"
script_name = "artist-alley-durable-object"
